    <script>
      (function () {
        try {
          var raw = window.localStorage.getItem('raseedi_theme_pref_v1');
          var theme = null;
          if (raw) {
            if (raw === 'dark' || raw === 'light' || raw === 'system') {
              theme = raw;
            } else {
              var parsed = JSON.parse(raw);
              if (
                parsed &&
                (parsed.theme === 'dark' || parsed.theme === 'light' || parsed.theme === 'system')
              ) {
                theme = parsed.theme;
              }
            }
          }
          if (!theme) {
            var legacy = window.localStorage.getItem('raseedi_settings_v1');
            if (legacy) {
              var parsedLegacy = JSON.parse(legacy);
              if (
                parsedLegacy &&
                (parsedLegacy.theme === 'dark' ||
                  parsedLegacy.theme === 'light' ||
                  parsedLegacy.theme === 'system')
              ) {
                theme = parsedLegacy.theme;
              }
            }
          }
          var isDark =
            theme === 'dark'
              ? true
              : theme === 'system'
              ? Boolean(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
              : false;
          var root = document.documentElement;
          root.classList.toggle('dark', isDark);
          root.style.colorScheme = isDark ? 'dark' : 'light';
          if (theme) root.dataset.theme = theme;
          var themeMeta = document.getElementById('raseedi-theme-color');
          if (themeMeta) {
            themeMeta.setAttribute('content', isDark ? '#081615' : '#F5EFE3');
          }
        } catch (e) {}
      })();
    </script>

    <script>
      window.addEventListener('vite:preloadError', function (event) {
        event.preventDefault();
        if (typeof navigator !== 'undefined' && navigator.onLine === false) return;
        try {
          var key = 'raseedi_chunk_reload_ts';
          var now = Date.now();
          var last = Number(window.sessionStorage.getItem(key) || '0');
          if (!last || now - last >= 20000) {
            window.sessionStorage.setItem(key, String(now));
            window.location.reload();
          }
        } catch (e) {
          window.location.reload();
        }
      });
    </script>
